# Colors (Tokyo Night Storm variant)
# Source https//github.com/zatchheems/tokyo-night-alacritty-theme

# Default colors
[colors.primary]
background = '#24283b'
foreground = '#a9b1d6'

# Normal colors
[colors.normal]
black   = '#32344a'
red     = '#f7768e'
green   = '#9ece6a'
yellow  = '#e0af68'
blue    = '#7aa2f7'
magenta = '#ad8ee6'
cyan    = '#449dab'
white   = '#9699a8'

# Bright colors
[colors.bright]
black   = '#444b6a'
red     = '#ff7a93'
green   = '#b9f27c'
yellow  = '#ff9e64'
blue    = '#7da6ff'
magenta = '#bb9af7'
cyan    = '#0db9d7'
white   = '#acb0d0'

# --- derivado de la paleta (enrich.py) ---
[colors.cursor]
text = '#24283b'
cursor = '#a9b1d6'

[colors.vi_mode_cursor]
text = '#24283b'
cursor = '#0db9d7'

[colors.selection]
text = '#a9b1d6'
background = '#364162'

[colors.search.matches]
foreground = '#24283b'
background = '#ff9e64'

[colors.search.focused_match]
foreground = '#24283b'
background = '#ff7a93'

[colors.footer_bar]
foreground = '#a9b1d6'
background = '#3c4157'

[colors.hints.start]
foreground = '#24283b'
background = '#ff9e64'

[colors.hints.end]
foreground = '#24283b'
background = '#7da6ff'
