# Gruvbox Dark - https://github.com/alacritty/alacritty-theme

[colors.primary]
background = '#282828'
foreground = '#ebdbb2'

[colors.normal]
black   = '#282828'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'

[colors.bright]
black   = '#928374'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ebdbb2'

# --- derivado de la paleta (enrich.py) ---
[colors.cursor]
text = '#282828'
cursor = '#ebdbb2'

[colors.vi_mode_cursor]
text = '#282828'
cursor = '#8ec07c'

[colors.selection]
text = '#ebdbb2'
background = '#4b5853'

[colors.search.matches]
foreground = '#282828'
background = '#fabd2f'

[colors.search.focused_match]
foreground = '#000000'
background = '#fb4934'

[colors.footer_bar]
foreground = '#ebdbb2'
background = '#4b4841'

[colors.hints.start]
foreground = '#282828'
background = '#fabd2f'

[colors.hints.end]
foreground = '#282828'
background = '#83a598'
